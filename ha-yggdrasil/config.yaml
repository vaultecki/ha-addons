name: "Yggdrasil (persistent)"
version: "0.0.1"
slug: ha_yggdrasil
description: >-
  Verbindet Home Assistant mit dem Yggdrasil-Overlay-Netzwerk (feste IPv6-Adresse,
  eingehende Verbindungen, lokale Peer-Discovery). Im Unterschied zum Original wird
  die Konfiguration inkl. privatem Schluessel dauerhaft in /data gespeichert und
  ueberlebt Neustarts und Updates, sodass sich die IP nicht mehr aendert.
url: "https://github.com/yggdrasil-network/yggdrasil-go"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
startup: services
boot: auto
backup: hot
host_network: true
devices:
  - /dev/net/tun
privileged:
  - NET_ADMIN
options:
  regenerate_config: false
schema:
  regenerate_config: bool
